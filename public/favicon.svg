<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="msBluePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="msBlueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="msWhitePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <filter id="msGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="256" height="256" rx="52" fill="#0B0F1A" />

  <g filter="url(#msGlow)">
    <!-- Upper Blue Diagonal Bar (S for Sahil - Progress & Momentum) -->
    <polygon
      points="197.6,31.6 229.6,57.7 167.2,109.9 135.3,83.8"
      fill="url(#msBluePrimary)"
    />

    <!-- Lower Blue Facet (S lower curve anchor) -->
    <polygon
      points="177.3,125.8 204.9,104.1 231.0,124.4 231.0,167.9"
      fill="url(#msBlueFacet)"
    />

    <!-- Main M/S White Geometric Monogram -->
    <polygon
      points="39.6,31.6 228.1,191.1 165.8,237.5 103.4,198.4 103.4,162.1 132.4,182.4 165.8,204.2 197.6,176.6 70.0,78.0 70.0,181.0 39.6,160.7"
      fill="url(#msWhitePrimary)"
    />
  </g>
</svg>