<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070B"/>
      <stop offset="50%" stop-color="#100F15"/>
      <stop offset="100%" stop-color="#050407"/>
    </linearGradient>

    <!-- Accent Red Glow -->
    <radialGradient id="redGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#E10600" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E10600" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="amberGlow" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#FFAE34" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FFAE34" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFAE34" stop-opacity="0"/>
    </radialGradient>

    <!-- Halftone Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F5F2F2"/>
      <stop offset="100%" stop-color="#A9A5AC"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dotPattern)"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>

  <!-- Subtle Minimal Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#292630" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Status Row -->
  <g transform="translate(80, 95)">
    <circle cx="6" cy="6" r="5" fill="#E10600"/>
    <circle cx="6" cy="6" r="8" fill="#E10600" fill-opacity="0.25"/>
    <text x="24" y="10" font-family="'IBM Plex Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#E10600" letter-spacing="3">PORTFOLIO // MHSAHIL.VERCEL.APP</text>
    <text x="960" y="10" text-anchor="end" font-family="'IBM Plex Mono', monospace, sans-serif" font-size="12" fill="#68646D" letter-spacing="2">2026 EDITION</text>
  </g>

  <!-- Main Hero Brand Typography -->
  <g transform="translate(80, 260)">
    <text x="0" y="0" font-family="'Anton', 'Inter', -apple-system, sans-serif" font-size="124" font-weight="900" fill="url(#textGrad)" letter-spacing="6">SAHIL</text>
    <text x="350" y="-30" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#E10600" letter-spacing="3">SYSTEMS &amp; SECURITY</text>
  </g>

  <!-- Subtitle & Role Statement -->
  <g transform="translate(80, 340)">
    <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Muhammed Sahil</text>
    <text x="0" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#A9A5AC">Cybersecurity Engineer &amp; Full-Stack Architect</text>
    <text x="0" y="80" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="400" fill="#68646D" max-width="800">
      Crafting fluid digital experiences, low-level systems (Nyota OS), and threat intelligence platforms (Xerova).
    </text>
  </g>

  <!-- Pill Badges -->
  <g transform="translate(80, 485)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="36" rx="8" fill="#17151D" stroke="#292630" stroke-width="1"/>
    <text x="90" y="23" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#F5F2F2" letter-spacing="1">CYBERSECURITY</text>

    <!-- Badge 2 -->
    <rect x="195" y="0" width="190" height="36" rx="8" fill="#17151D" stroke="#292630" stroke-width="1"/>
    <text x="290" y="23" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#F5F2F2" letter-spacing="1">FULL-STACK SYSTEMS</text>

    <!-- Badge 3 -->
    <rect x="400" y="0" width="180" height="36" rx="8" fill="#17151D" stroke="#292630" stroke-width="1"/>
    <text x="490" y="23" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#F5F2F2" letter-spacing="1">KINETIC UI/UX</text>

    <!-- Badge 4 -->
    <rect x="595" y="0" width="150" height="36" rx="8" fill="#17151D" stroke="#292630" stroke-width="1"/>
    <text x="670" y="23" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#E10600" letter-spacing="1">OPEN SOURCE</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="40" y="586" width="1120" height="4" rx="2" fill="#E10600"/>
</svg>

